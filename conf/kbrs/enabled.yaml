# conf/kbrs/enabled.yaml
use_kbrs: true
loss_weights:
  loss_rpn_box_reg: ${kbrs_loss.loss_rpn_box_reg}
  loss_kbrs:        ${kbrs_loss.loss_kbrs}

score_weights:
  density: 0.3
  mixture: 3.0
  centeredness: 0.3

kbrs_params:
  region_size: [20, 12]
  score_stride: 1

  window_size: ${window_size} 
  per_window: 9

  # score_weights 참조
  density:      ${kbrs.score_weights.density}
  mixture:      ${kbrs.score_weights.mixture}
  centeredness: ${kbrs.score_weights.centeredness}

  feature_map_name: smallest
  scorer_impl: conv

  detach_scorer_input: false
  learnable: 'static'
  tau: 4.0
  use_entropy: false
  downsample_before: null
  log_into_losses: false

  gate_channels: [8]
  gate_reduce: 'mean'
  gate_gain: 0.8

  projections:
    A: [0, 1, 2, 3]
    B: [4, 5, 6, 7]
    
  mixture_mode: 'confusion'
  mixture_power: 1.0
  mixture_tau: 2.0
  mixture_between: ['A', 'B']

  viz_components: true
  accumulate_epoch: true
  component_losses: true