# config.yaml
defaults:
  - dataset: fold1
  - architecture: maskrcnn
  - plugins/kbrs: disabled
  - plugins/density_peak: disabled
  - plugins/probabilistic_query: disabled
  - plugins/kbrs/loss: kbrs025
  - optional plugins/kbrs/score: null
  - _self_ 

use_kbrs: ${plugins.kbrs.use_kbrs}
use_density_peak: ${plugins.density_peak.use_density_peak}
use_probabilistic_query: ${plugins.probabilistic_query.use_probabilistic_query}

kbrs: ${plugins.kbrs}
density_peak: ${plugins.density_peak}
probabilistic_query: ${plugins.probabilistic_query}
# ===== Data & Replays =====
train_replays: ${dataset.train_replays}
test_replays: ${dataset.test_replays}
include_components: [worker, ground, air, building, vision]
# ROCI (Joo et al.) adds the regions the observers agree on as extra training
# targets. It selects a different label file, <label_method>_roci, which
# preprocessing writes only when generated with --roci. Changing this requires
# training from scratch; it cannot be applied to an existing checkpoint.
roci: false
label_method: all_correct
data_root: /workspace/data

# ===== Hyperparameters =====
seed: 123
max_epoch: 30
# 체크포인트를 몇 에폭마다 남길지. 마지막 에폭은 이 간격과 무관하게 항상
# 저장하므로 max_epoch=30, checkpoint_every=10 이면 10/20/30 이 남는다.
# 0 이면 마지막 에폭만 저장한다.
checkpoint_every: 10
# Path to a checkpoint to continue from, e.g.
#   make train ARGS="resume=/workspace/models/<run>/model_020.pth"
# Weights, optimizer and schedule are all restored, so the run picks up where
# it stopped rather than restarting the learning rate. Checkpoints written
# before this existed hold weights only; those load, but the continuation is
# not faithful and the log says so - keep such a run out of a seed comparison.
resume: null
# cosine: max_epoch에 걸친 코사인 감쇠 (기본).
# step: 예전 StepLR 모양이되 감쇠 지점이 max_epoch//3 마다로 재조정된 것.
# 예전 값(step_size=3 고정)은 30에폭 실행을 6에폭에서 끝냈다. src/train.py 참조.
lr_schedule: cosine
window_size: 4
interval: 8
batch_size: 32
learning_rate: 0.005
sample_ratio: 1.0
score_threshold: ${architecture.score_threshold}

# ===== Validation & Testing =====
val_count: 100
test_eval_every: 0

# ===== Environment & Execution =====
mode: "train_and_inference"
log_level: log
do_inference_after_train: true
cuda: true
num_workers: 1

# ===== Paths =====
prediction_root: /workspace/predictions
model_root: /workspace/models
log_root: /workspace/models
id_string: ""

hydra:
  run:
    dir: /workspace/results/hydra/run/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: /workspace/results/hydra/multirun
    subdir: ${now:%Y%m%d_%H%M%S}_${hydra.job.num}