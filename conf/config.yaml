defaults:
  - dataset: fold1
  - model: vanilla

  - kbrs_loss: kbrs025
  - kbrs_score: base
  - _self_          

include_components: [worker, ground, air, building, vision]
label_method: all_correct
seed: 123
max_epoch: 30
window_size: 4
interval: 8
batch_size: 16
sample_ratio: 1.00
log_level: log
do_inference_after_train: true

learning_rate: 0.005
val_count: 1000
test_eval_every: 0
do_normalize: false
normalize_mean: null
normalize_std: null
resize_mode: resize
min_sizes: [800]
max_size: 1333
rpn_small_anchors: false
cuda: true
num_workers: 4
data_root: ./data
log_root: ./models
id_string: ""

use_kbrs:      ${model.use_kbrs}
loss_weights:  ${model.loss_weights}
kbrs_params:   ${model.kbrs_params}

hydra:
  run:
    # 단일 실행 시 작업 디렉토리 (사실 우리는 크게 안 씀)
    dir: /tmp/hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

  sweep:
    # 멀티런(-m) 결과가 들어갈 상위 디렉토리
    dir: /tmp/hydra_multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    # 각 job마다 서브폴더 이름
    subdir: ${hydra.job.num}