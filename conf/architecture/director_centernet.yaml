# conf/architecture/director_centernet.yaml
model_name: director_centernet
score_threshold: 0.1
centernet_down_ratio: 4
k_max: 3
conf_threshold: 0.1
render_sigma: 4.0            # tiles; = 1 heatmap cell at stride 4
u_observers: 5

# NOTE: no resize_mode / image_size here. Only build_maskrcnn_backbone reads
# those, so they were inert for this model and implied a 640x640 input that
# never existed - the dataset hands over the raw 128x128 tile tensor, which is
# why the heatmap is 32x32 at stride 4 and not the 4x4 a stride of 32 implies.
do_normalize: false

loss_weights:
  lambda_hcm: 1.0
  lambda_off: 1.0
  lambda_sz: 0.1
  lambda_rmc: 0.5
  lambda_rep: 0.3
  # L_smooth is Huber-on-displacement / map-diagonal, not squared L2 in tiles.
  # At 0.2 the old form dominated the globally clipped gradient and every
  # ablation carrying it collapsed to a fixed camera.
  lambda_sm: 0.1

# L_smooth shaping (src/losses/director_losses.py)
smooth_huber_delta: 5.0      # tiles; below this the penalty stays quadratic
smooth_warmup_start: 5       # epochs [0, 5) train with L_smooth off
smooth_warmup_full: 10       # linear ramp to full weight by epoch 10
soft_center_radius: 2        # feature cells in the soft-argmax window
peak_border_margin: 1        # drop the outermost ring from peak candidates
trainable_layers: 5          # unfreeze layer1; the heatmap head reads only that level
head_conv: 64                # hidden width of each head
dense_positives: false       # focal positive at every observer centre, not only the Top-1 mode
