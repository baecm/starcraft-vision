# conf/model/kbrs.yaml
use_kbrs: true

# kbrs_loss 그룹값 사용
loss_weights:
  loss_objectness: 1.0
  loss_rpn_box_reg: ${kbrs_loss.loss_rpn_box_reg}
  loss_kbrs:       ${kbrs_loss.loss_kbrs}

# kbrs_score 그룹값 사용
kbrs_params:
  region_size: [20, 12]
  score_stride: 1
  mixture_tau: 2.0
  mixture_mode: confusion
  mixture_power: 1.0
  window_size: ${window_size}    # 위쪽 공통 값과 연결
  per_window: 9

  score_weights:
    density:      ${kbrs_score.density}
    mixture:      ${kbrs_score.mixture}
    centeredness: ${kbrs_score.centeredness}

  # projections, gate 등등 나머지 KBRS 설정들도 여기에
