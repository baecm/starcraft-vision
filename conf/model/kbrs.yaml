use_kbrs: true

loss_weights:
  loss_objectness: 1.0
  loss_rpn_box_reg: ${kbrs_loss.loss_rpn_box_reg}
  loss_kbrs:        ${kbrs_loss.loss_kbrs}

kbrs_params:
  region_size: [20, 12]
  score_stride: 1
  mixture_tau: 2.0
  mixture_mode: confusion
  mixture_power: 1.0
  window_size: ${window_size} 
  per_window: 9
  
  # score_weights로 묶지 않고 밖으로 뺌 (KBRS_MaskRCNN.py와 동기화)
  density:      ${kbrs_score.density}
  mixture:      ${kbrs_score.mixture}
  centeredness: ${kbrs_score.centeredness}