services:
  dispatcher:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile
    image: starcraft-vision:dev
    environment:
      - PYTHONPATH=/workspace/src
      - TORCH_HOME=/workspace/.torch_cache
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
    volumes:
      - ../data:/workspace/data
      - ../src:/workspace/src
      - ../models:/workspace/models
      - ../predictions:/workspace/predictions
      - ../.torch_cache:/workspace/.torch_cache
      - ./entrypoint.sh:/workspace/entrypoint.sh
    user: "${UID}:${GID}"
    shm_size: '4g'
    working_dir: /workspace
    stdin_open: true
    runtime: nvidia
    entrypoint: ["bash", "entrypoint.sh"]