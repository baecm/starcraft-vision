  notebook:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile
    image: starcraft-vision:dev
    environment:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "Agg"
      HOME: /tmp
      JUPYTER_RUNTIME_DIR: /tmp/jupyter_runtime
      JUPYTER_DATA_DIR: /tmp/jupyter_data
      JUPYTER_CONFIG_DIR: /tmp/jupyter_config
      IPYTHONDIR: /tmp/ipython
    volumes:
      - ${DATA_DIR}:/workspace/data
      - ${SRC_DIR}:/workspace/src
      - ${MODELS_DIR}:/workspace/models
      - ${PREDICTIONS_DIR}:/workspace/predictions
      - ${RESULTS_DIR}:/workspace/results
      - ${NOTEBOOKS_DIR}:/workspace/notebooks
    user: "${UID}:${GID}"
    shm_size: '${SHARED_MEMORY}'
    working_dir: /workspace
    stdin_open: true
    tty: true
    runtime: nvidia              # 최신 compose면 gpus: ["all"] 사용 가능
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"  # 로컬루프백에만 노출
    entrypoint:
    - bash
    - -lc
    - |
      set -euo pipefail
      RUNTIME_DIR=/tmp/jupyter_runtime
      DATA_DIR=/tmp/jupyter_data
      CONFIG_DIR=/tmp/jupyter_config
      IPYTHON_DIR=/tmp/ipython

      export HOME=/tmp
      mkdir -p "$$RUNTIME_DIR" "$$DATA_DIR" "$$CONFIG_DIR" "$$IPYTHON_DIR"
      export JUPYTER_RUNTIME_DIR="$$RUNTIME_DIR"
      export JUPYTER_DATA_DIR="$$DATA_DIR"
      export JUPYTER_CONFIG_DIR="$$CONFIG_DIR"
      export IPYTHONDIR="$$IPYTHON_DIR"

      exec jupyter lab \
        --ip=0.0.0.0 --port=8888 --no-browser \
        --ServerApp.root_dir=/workspace/notebooks \
        --ServerApp.token='' --ServerApp.password='' \
        --NotebookApp.token='' --NotebookApp.password='' \
        --IdentityProvider.token=''
    profiles: ["dev"]
