# infra/docker-compose.yml
services:
  dispatcher:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile
    image: starcraft-vision:dev
    environment:
      - PYTHONPATH=/workspace/src
      - TORCH_HOME=/workspace/.torch_cache
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
    volumes:
      - ${WANDB_API_KEY}:/run/secrets/wandb_api_key:ro
      - ${SYNOLOGY_CHAT_WEBHOOK_URL}:/run/secrets/synology_chat_webhook_url:ro
      - ${TORCH_CACHE_DIR}:/workspace/.torch_cache
      - ${DATA_DIR}:/workspace/data
      - ${SRC_DIR}:/workspace/src
      - ${MODELS_DIR}:/workspace/models
      - ${PREDICTIONS_DIR}:/workspace/predictions
      - ${RESULTS_DIR}:/workspace/results
      - ${CONF_DIR}:/workspace/conf
      - ./entrypoint.sh:/workspace/entrypoint.sh
    user: "${UID}:${GID}"
    shm_size: '${SHARED_MEMORY}'
    working_dir: /workspace
    stdin_open: true
    runtime: nvidia
    entrypoint: ["bash", "entrypoint.sh"]

  zeppelin:
    image: apache/zeppelin:0.12.0
    container_name: zeppelin
    user: "root"
    ports:
      - "8080:8080"
    environment:
      - ZEPPELIN_ADDR=0.0.0.0
      - ZEPPELIN_NOTEBOOK_DIR=/workspace/zeppelin/notebook
      - ZEPPELIN_LOG_DIR=/workspace/zeppelin/logs
      - ZEPPELIN_CONF_DIR=/workspace/zeppelin/conf
      - PYSPARK_PYTHON=python3
      - ZEPPELIN_PYTHON=python3
    volumes:
      # infra/ 외부의 프로젝트 루트 zeppelin 폴더를 바인드
      - ../zeppelin/notebook:/workspace/zeppelin/notebook
      - ../zeppelin/logs:/workspace/zeppelin/logs
      - ../zeppelin/conf:/workspace/zeppelin/conf
      
      # 데이터 경로는 절대 경로이므로 그대로 유지
      - /mnt/nas/baecm/starcraft-vision/data:/workspace/data
      - /mnt/nas/baecm/starcraft-vision/models:/workspace/models