# infra/docker-compose.yml
x-common-config: &common-config
  build:
    context: ../
    dockerfile: infra/docker/Dockerfile
  image: starcraft-vision:dev
  environment:
    - HOME=/tmp
    # The container runs as ${UID}:${GID}, which has no entry in the image's
    # /etc/passwd, so getpass.getuser() raises KeyError. torch.compile hits it
    # via torch._inductor's default cache dir, which torchvision's roi_align
    # reaches on the Mask R-CNN path. Setting either variable avoids it:
    # getuser() checks USER first, and cache_dir() honours an explicit path.
    - USER=${USER:-worker}
    - TORCHINDUCTOR_CACHE_DIR=/tmp/torchinductor
    # Recent torchvision wraps roi_align in a torch.compile hook, and inductor
    # reaches Triton, which needs a C compiler the runtime image does not have.
    # Nothing here needs compiled kernels. src/utils/torch_compat.py sets these
    # too, for the case where a stale image ignores one of the names.
    - TORCH_COMPILE_DISABLE=1
    - TORCHDYNAMO_DISABLE=1
    - JUPYTER_RUNTIME_DIR=/tmp/jupyter_runtime
    - JUPYTER_DATA_DIR=/tmp/jupyter_data
    - PYTHONPATH=/workspace/src
    - TORCH_HOME=/workspace/.torch_cache
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
    - ENABLE_SYNOLOGY_CHAT=${ENABLE_SYNOLOGY_CHAT:-false}
    - WANDB_DISABLE_TELEMETRY=${WANDB_DISABLE_TELEMETRY:-true}
    - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
    - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none}
    - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none}
    - WANDB_SILENT=${WANDB_SILENT:-true}
    - WANDB_CORE=${WANDB_CORE:-false}
    # exported by the Makefile from the host checkout; the container has no
    # .git of its own, so this is the only way a run can record its commit
    - GIT_COMMIT=${GIT_COMMIT:-}
    - GIT_DIRTY=${GIT_DIRTY:-}
  user: "${UID}:${GID}"
  shm_size: '${SHARED_MEMORY}'
  working_dir: /workspace
  stdin_open: true
  runtime: nvidia
  entrypoint: ["bash", "entrypoint.sh"]

services:
  preprocessor:
    <<: *common-config
    volumes:
      - ${SRC_DIR}:/workspace/src:ro
      - ${DATA_DIR}:/workspace/data
      - ${SYNOLOGY_CHAT_WEBHOOK_URL}:/run/secrets/synology_chat_webhook_url:ro
      - ./entrypoint.sh:/workspace/entrypoint.sh:ro

  trainer:
    <<: *common-config
    volumes:
      - ${WANDB_API_KEY}:/run/secrets/wandb_api_key:ro
      - ${SYNOLOGY_CHAT_WEBHOOK_URL}:/run/secrets/synology_chat_webhook_url:ro
      - ${TORCH_CACHE_DIR}:/workspace/.torch_cache
      # writable: training derives caches next to the labels they come from
      # (label pickles via ensure_label_pickles, ranked modes via ensure_mode_cache)
      - ${DATA_DIR}:/workspace/data
      - ${SRC_DIR}:/workspace/src:ro
      - ${MODELS_DIR}:/workspace/models
      - ${PREDICTIONS_DIR}:/workspace/predictions
      - ${RESULTS_DIR}:/workspace/results
      - ${CONF_DIR}:/workspace/conf:ro
      - ./entrypoint.sh:/workspace/entrypoint.sh:ro

  inferencer:
    <<: *common-config
    volumes:
      - ${SYNOLOGY_CHAT_WEBHOOK_URL}:/run/secrets/synology_chat_webhook_url:ro
      - ${TORCH_CACHE_DIR}:/workspace/.torch_cache
      - ${DATA_DIR}:/workspace/data:ro
      - ${SRC_DIR}:/workspace/src:ro
      - ${MODELS_DIR}:/workspace/models:ro
      - ${PREDICTIONS_DIR}:/workspace/predictions
      - ./entrypoint.sh:/workspace/entrypoint.sh:ro

  evaluator:
    <<: *common-config
    volumes:
      - ${SYNOLOGY_CHAT_WEBHOOK_URL}:/run/secrets/synology_chat_webhook_url:ro
      - ${DATA_DIR}:/workspace/data
      - ${SRC_DIR}:/workspace/src:ro
      - ${MODELS_DIR}:/workspace/models:ro
      - ${PREDICTIONS_DIR}:/workspace/predictions:ro
      - ${RESULTS_DIR}:/workspace/results
      - ./entrypoint.sh:/workspace/entrypoint.sh:ro

  debugger:
    <<: *common-config
    volumes:
      - ${WANDB_API_KEY}:/run/secrets/wandb_api_key:ro
      - ${SYNOLOGY_CHAT_WEBHOOK_URL}:/run/secrets/synology_chat_webhook_url:ro
      - ${TORCH_CACHE_DIR}:/workspace/.torch_cache
      - ${DATA_DIR}:/workspace/data
      - ${SRC_DIR}:/workspace/src
      - ${MODELS_DIR}:/workspace/models
      - ${PREDICTIONS_DIR}:/workspace/predictions
      - ${RESULTS_DIR}:/workspace/results
      - ${CONF_DIR}:/workspace/conf
      - ../scripts:/workspace/scripts
      # the unit tests import from src/ and need torch, so they can only run
      # inside the image; scripts/ was mounted for the same reason
      - ../tests:/workspace/tests
      - ./entrypoint.sh:/workspace/entrypoint.sh

  notebook:
    <<: *common-config
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ${WANDB_API_KEY}:/run/secrets/wandb_api_key:ro
      - ${SYNOLOGY_CHAT_WEBHOOK_URL}:/run/secrets/synology_chat_webhook_url:ro
      - ${TORCH_CACHE_DIR}:/workspace/.torch_cache
      - ${DATA_DIR}:/workspace/data
      - ${SRC_DIR}:/workspace/src
      - ${NOTEBOOKS_DIR:-../notebooks}:/workspace/notebooks
      - ../scripts:/workspace/scripts
      - ${MODELS_DIR}:/workspace/models
      - ${PREDICTIONS_DIR}:/workspace/predictions
      - ${RESULTS_DIR}:/workspace/results
      - ${CONF_DIR}:/workspace/conf
      - ./entrypoint.sh:/workspace/entrypoint.sh

